# Cloudflare Worker: same-origin API proxy for manitobarydercup.com.
# Bound to `/api/*` on the same hostname the Pages site serves, so the SPA's relative
# API calls reach the Cloud Run services without CORS. Deploy with `wrangler deploy`.

name = "mbrc-api-proxy"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# These routes run the Worker *in front of* Pages for matching paths; every other path
# falls through to the Pages site. The zone must exist in this Cloudflare account and the
# Pages project must have manitobarydercup.com as a custom domain.
routes = [
  { pattern = "manitobarydercup.com/api/*", zone_name = "manitobarydercup.com" },
  { pattern = "www.manitobarydercup.com/api/*", zone_name = "manitobarydercup.com" },
]

# Non-secret upstream URLs — from `gcloud run services describe <svc>
# --format='value(status.url)'`. Safe to commit: both services 403 anything arriving
# without the X-Proxy-Secret header below, so knowing the URL grants nothing.
[vars]
HEIMDALL_URL = "https://heimdall-tpd36czisa-uc.a.run.app"
SCORECARD_URL = "https://scorecard-tpd36czisa-uc.a.run.app"

# PROXY_SECRET is a secret, not a var. It must equal the `proxy-secret` in Secret Manager
# that both Cloud Run services read (they enforce the X-Proxy-Secret header). Set it with:
#   gcloud secrets versions access latest --secret=proxy-secret | wrangler secret put PROXY_SECRET
